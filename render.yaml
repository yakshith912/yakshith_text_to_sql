services:
  - type: web
    name: yakshith-text-to-sql
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: RENDER
        value: "true"
      - key: DB_TYPE
        value: "sqlite"
